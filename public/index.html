<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#2f5a26" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Cozy Vibes</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏡</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <!-- Top bar -->
  <div id="hud" class="hidden">
    <div class="pill" id="roomPill">🏡 <span id="roomName"></span> · <span id="playerCount">1</span> here</div>
    <button class="pill btn" id="inviteBtn">🔗 Invite</button>
    <div class="spacer"></div>
    <button class="pill btn round" id="zoomOut" aria-label="Zoom out">−</button>
    <button class="pill btn round" id="zoomIn" aria-label="Zoom in">+</button>
  </div>

  <!-- Bottom bar -->
  <div id="bottomBar" class="hidden">
    <form id="chatForm" autocomplete="off">
      <input id="chatInput" maxlength="120" placeholder="Say something…" enterkeyhint="send" />
      <button class="btn primary" type="submit">Say</button>
    </form>
    <button class="btn" id="emoteBtn" aria-label="Emotes">😀</button>
  </div>
  <div id="emoteTray" class="tray hidden"></div>

  <!-- Character action menu -->
  <div id="actionMenu" class="hidden" role="menu">
    <div class="menu-head">
      <canvas id="menuPortrait" width="88" height="140"></canvas>
      <div>
        <div id="menuName"></div>
        <div id="menuSub"></div>
      </div>
      <button class="close" id="menuClose" aria-label="Close">✕</button>
    </div>
    <div id="menuButtons"></div>
  </div>

  <div id="toasts"></div>
  <div id="status" class="hidden"></div>

  <!-- Join screen -->
  <div id="join">
    <div class="card">
      <h1>Cozy Vibes</h1>
      <p class="sub">Hang out in a little house with your friends.</p>
      <label>Your name
        <input id="nameInput" maxlength="16" placeholder="e.g. Sam" autocomplete="nickname" />
      </label>
      <div class="label">Pick a character</div>
      <div id="picker"></div>
      <label>House code
        <input id="roomInput" maxlength="24" placeholder="lobby" autocapitalize="off" />
      </label>
      <p class="hint">Friends who use the same house code end up in the same house.</p>
      <button class="btn primary big" id="joinBtn">Enter the house</button>
    </div>
  </div>

  <script type="module" src="js/game.js"></script>
</body>
</html>
